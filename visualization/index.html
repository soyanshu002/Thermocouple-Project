<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blast Furnace Thermocouple Visualization</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: white;
            font-family: sans-serif;
        }

        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 100;
        }

        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px;
            border-radius: 4px;
            pointer-events: none;
            display: none;
            z-index: 100;
        }

        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.8);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #555;
            z-index: 100;
        }

        #dateLabel {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 5px;
            display: block;
        }

        input[type=range] {
            width: 400px;
            cursor: pointer;
        }

        #toggleBtn {
            margin-top: 10px;
            padding: 8px 16px;
            background: #444;
            color: #fff;
            border: 1px solid #777;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        #toggleBtn:hover {
            background: #666;
        }

        #toggleBtn.active {
            background: #00aa00;
            border-color: #00ff00;
        }
    </style>
    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="info">
        <h1>Blast Furnace Thermocouple Visualization</h1>
        <p>Left Click: Rotate | Right Click: Pan | Scroll: Zoom</p>
    </div>
    <div id="tooltip"></div>
    <div id="controls">
        <span id="dateLabel">Loading Data...</span>
        <input type="range" id="dateSlider" disabled>
        <button id="toggleBtn">Switch to Heatmap View</button>
        <button id="heightToggleBtn"
            style="margin-top: 10px; padding: 8px 16px; background: #555; color: #fff; border: 1px solid #777; border-radius: 4px; cursor: pointer; font-size: 14px; margin-left: 5px;">Switch
            to Full Height</button>
        <button id="isolatePlanesBtn"
            style="margin-top: 10px; padding: 8px 16px; background: #600060; color: #fff; border: 1px solid #ff77ff; border-radius: 4px; cursor: pointer; font-size: 14px; margin-left: 5px;">Isolate
            Stacked Planes</button>
        <select id="sectorSelect"
            style="margin-top: 10px; padding: 8px; background: #555; color: #fff; border: 1px solid #777; border-radius: 4px; cursor: pointer; font-size: 14px; margin-left: 5px;">
            <option value="all">View All Sectors (360°)</option>
            <option value="0">Sector 0-60°</option>
            <option value="1">Sector 60-120°</option>
            <option value="2">Sector 120-180°</option>
            <option value="3">Sector 180-240°</option>
            <option value="4">Sector 240-300°</option>
            <option value="5">Sector 300-360°</option>
        </select>
        <button id="exportBtn"
            style="margin-top: 10px; padding: 8px 16px; background: #0078D4; color: #fff; border: 1px solid #005A9E; border-radius: 4px; cursor: pointer; font-size: 14px; margin-left: 5px;">Export 3D Model (for PPT)</button>
        <select id="sliceMode"
    </div>

    <!-- Panel for High Temp TCs -->
    <div id="highTempPanel" style="
        position: absolute;
        top: 10px;
        right: 10px;
        width: 300px;
        max-height: 80vh;
        overflow-y: auto;
        background: rgba(30, 30, 30, 0.9);
        border: 1px solid #555;
        border-radius: 8px;
        padding: 10px;
        font-size: 14px;
        z-index: 100;
    ">
        <h3 style="margin-top: 0; color: #ff4444;">High Temp TCs (>1150°C)</h3>
        <div id="highTempCount" style="margin-bottom: 5px; font-weight: bold;">Count: 0</div>
        <table style="width: 100%; border-collapse: collapse; font-size: 12px;">
            <thead>
                <tr style="border-bottom: 1px solid #777;">
                    <th style="text-align: left; padding: 4px;">ID</th>
                    <th style="text-align: left; padding: 4px;">Pos</th>
                    <th style="text-align: right; padding: 4px;">Temp</th>
                </tr>
            </thead>
            <tbody id="highTempList">
                <!-- Rows will be added here -->
            </tbody>
        </table>
    </div>
    <script type="module" src="./script.js?v=8"></script>
</body>

</html>
